<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>본인 전용 테스트 · 토닥</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3eb;color:#343d32;font:16px/1.6 system-ui,sans-serif}main{max-width:440px;margin:12vh auto;padding:28px}h1{font-size:25px;margin:10px 0}p{color:#66705f}label{display:block;margin-top:26px}input,button{width:100%;padding:14px;border:1px solid #b4baa9;border-radius:10px;font:inherit}button{margin-top:14px;background:#455840;color:white;cursor:pointer}button:disabled{opacity:.5}small{color:#68725f}#status{white-space:pre-wrap}#workspace{position:fixed;inset:0;background:#f6f3eb}#bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px}#bar button{width:auto;padding:4px 12px;margin:0}iframe{border:0;width:100%;height:calc(100% - 48px)}[hidden]{display:none!important}
</style>
<main id="login">
<small>토닥 · 본인 전용</small><h1>테스트 공방</h1>
<p>등록한 이메일로 로그인하면 테스트 화면을 볼 수 있어요.</p>
<form id="form"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required placeholder="등록한 이메일 주소"><button id="send">로그인 링크 받기</button></form>
<p id="status" role="status" aria-live="polite"></p>
<small>일반 공방과 테스트 작품은 따로 저장돼요.</small>
</main>
<section id="workspace" hidden><div id="bar"><span>본인 전용 테스트 · 작품 별도 저장</span><button id="logout">나가기</button></div><iframe id="studio" title="토닥 테스트 공방" sandbox="allow-scripts allow-same-origin allow-downloads allow-modals"></iframe></section>
<script type="module">
const API='https://bdyqynoybwwvmnxizcrl.supabase.co';
const KEY='sb_publishable_2VuIpv-JJ5p12PzmFBUchA_E5dmCX1C';
const ENDPOINT=API+'/functions/v1/private-preview';
const SESSION='todak.private-preview.auth';
const $=id=>document.getElementById(id);
let session=null;
async function auth(path,body,token){
 const response=await fetch(API+'/auth/v1/'+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.msg||data.message||data.error_description||'로그인 요청을 처리하지 못했어요.');
 return data;
}
function forget(){session=null;sessionStorage.removeItem(SESSION);$('studio').removeAttribute('srcdoc');$('workspace').hidden=true;$('login').hidden=false;}
async function openStudio(){
 $('status').textContent='본인 확인 후 테스트 화면을 불러오고 있어요.';
 try{
  if(!session?.access_token)throw Error('이메일의 로그인 링크로 다시 들어와 주세요.');
  if(session.expires_at*1000<Date.now()+30000){session=await auth('token?grant_type=refresh_token',{refresh_token:session.refresh_token});session.expires_at=Math.floor(Date.now()/1000)+session.expires_in;}
  const response=await fetch(ENDPOINT,{headers:{Authorization:'Bearer '+session.access_token},cache:'no-store'});
  if(!response.ok)throw Error(response.status===403?'이 이메일에는 테스트 화면 이용 권한이 없어요.':'로그인이 만료됐어요. 이메일 링크로 다시 들어와 주세요.');
  const data=await response.json();
  sessionStorage.setItem(SESSION,JSON.stringify(session));
  $('studio').srcdoc=data.html;$('workspace').hidden=false;$('login').hidden=true;
 }catch(error){forget();$('status').textContent=error.message;}
}
$('form').onsubmit=async event=>{
 event.preventDefault();$('send').disabled=true;
 try{
  // The server checks the allowed email before asking Auth to send anything.
  const response=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim()})});
  const data=await response.json();if(!response.ok)throw Error(data.error||'로그인 링크를 보내지 못했어요.');
  $('status').textContent='이메일에서 로그인 링크를 눌러 주세요. 메일이 없으면 스팸함도 확인해 주세요.';
 }catch(error){$('status').textContent=error.message;}
 finally{$('send').disabled=false;}
};
$('logout').onclick=async()=>{const token=session?.access_token;forget();$('status').textContent='테스트 공방에서 나왔어요.';if(token)try{await auth('logout?scope=local',{},token);}catch{}};
const fragment=new URLSearchParams(location.hash.slice(1));
if(fragment.has('access_token')){
 session={access_token:fragment.get('access_token'),refresh_token:fragment.get('refresh_token'),expires_at:Math.floor(Date.now()/1000)+Number(fragment.get('expires_in')||3600)};
 history.replaceState(null,'',location.pathname);await openStudio();
}else if(fragment.has('error')){
 history.replaceState(null,'',location.pathname);$('status').textContent='로그인 링크가 만료됐거나 사용할 수 없어요. 새 링크를 받아 주세요.';
}else{try{session=JSON.parse(sessionStorage.getItem(SESSION)||'null');}catch{}if(session)await openStudio();}
</script>
</html>
